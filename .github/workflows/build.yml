name: HarmonyOS App Build

# 触发条件：代码推送、PR 提交、手动触发
on:
  push:
    branches: ["main", "master", "dev", "develop"]
  pull_request:
    branches: ["main", "master", "dev", "develop"]
  workflow_dispatch:

# 最小权限：构建仅需读取仓库内容，上传产物使用 Actions 内置机制而非 GITHUB_TOKEN
permissions:
  contents: read

# 同一分支的重复推送取消上一次未完成的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译校验（debug）
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 全部门禁 + 自测（批P 建议 #1854 后续：清单以 gates_selftest.mjs 的 GATES
      # 数组为唯一来源，新增门禁只改该数组即自动进 CI，逐项 [OK]/[FAIL] 输出；
      # 原八步硬编码清单有「新门禁漏加 CI 静默不跑」漂移风险）
      - name: Gate checks + selftests
        run: bash scripts/run-gates.sh

      - name: Build HAP
        id: build
        uses: ./.github/actions/build-hap
        with:
          # 自托管命令行工具链 zip 的地址（仓库变量 Settings → Secrets and variables → Variables）
          # 说明：工程需要 6.1.1.x 的官方命令行工具链，公开镜像仅 6.1.0.816，modelVersion 不兼容
          tools-url: ${{ vars.HARMONY_TOOLS_URL }}
          # 可选：自托管 ArkUI-X SDK（留空则用华为云官方镜像）
          arkuix-sdk-url: ${{ vars.ARKUIX_SDK_URL }}
          build-mode: debug

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmony-app-debug
          path: |
            **/build/**/outputs/**/*.hap
            **/build/**/outputs/**/*.app
            **/build/**/outputs/**/*.hsp
            **/build/**/outputs/**/*.har
          if-no-files-found: error
