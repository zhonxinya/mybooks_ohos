name: HarmonyOS Release

# 触发条件：推送 v* 标签、手动触发
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（如 v1.0.0，需已存在于仓库）
        required: true

# 默认最小权限，仅读取仓库内容
permissions:
  contents: read

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    # 仅发布作业需要写权限以创建/更新 Release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build HAP
        id: build
        uses: ./.github/actions/build-hap
        with:
          # 自托管命令行工具链 zip 的地址（仓库变量 Settings → Secrets and variables → Variables）
          # 说明：工程需要 6.1.1.x 的官方命令行工具链，公开镜像仅 6.1.0.816，modelVersion 不兼容
          tools-url: ${{ vars.HARMONY_TOOLS_URL }}
          # 可选：自托管 ArkUI-X SDK（留空则用华为云官方镜像）
          arkuix-sdk-url: ${{ vars.ARKUIX_SDK_URL }}
          build-mode: release

      - name: Build Android APK
        id: build-apk
        uses: ./.github/actions/build-apk
        with:
          tools-url: ${{ vars.HARMONY_TOOLS_URL }}
          build-mode: release
          arch: arm64
          # 固定的 release 签名：签名一致才能跨版本覆盖安装（应用内升级前提）
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Package Artifact
        id: package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.build.outputs.hap-path }}" "dist/mybooks_ohos-${TAG}.hap"
          cp "${{ steps.build-apk.outputs.apk-path }}" "dist/mybooks_ohos-${TAG}-android-arm64.apk"
          ls -lh dist/

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          HAP="dist/mybooks_ohos-${TAG}.hap"
          APK="dist/mybooks_ohos-${TAG}-android-arm64.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新产物"
            gh release upload "$TAG" "$HAP" "$APK" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$HAP" "$APK" \
              --title "mybooks_ohos $TAG" \
              --verify-tag \
              --generate-notes
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmony-app-release
          path: |
            dist/*.hap
            dist/*.apk
          if-no-files-found: error
