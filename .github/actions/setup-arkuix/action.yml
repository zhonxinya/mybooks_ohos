name: Setup ArkUI-X Toolchain
description: 准备 ACE Tools（ArkUI-X SDK + 鸿蒙命令行工具链）并把 ace 所需路径/配置全部注册好

# 被 build-hap / build-apk 复用。步骤依据：本机实测（详见 docs/ArkUI-X-Android迁移指南.md 的 CI 章节），
# 缺任何一步都会导致 ace/hvigor 报错（SDK 未注册 / 工程需升级 / 找不到跨端工程 / 许可证未接受）。

inputs:
  tools-version:
    description: 鸿蒙命令行工具链版本（须与本工程 hvigor-config 的 modelVersion 配套：6.1.1.x）
    required: false
    default: '6.1.1.300'
  tools-url:
    description: 命令行工具链 zip 完整地址（留空则回退第三方镜像拼 URL；自托管或华为 CDN 签名链接请传入）
    required: false
    default: ''
  arkuix-sdk-version:
    description: ArkUI-X SDK 版本
    required: false
    default: '6.1.1.111'
  arkuix-sdk-url:
    description: ArkUI-X SDK zip 完整地址（留空用华为云官方镜像；自托管请传入）
    required: false
    default: ''
  arkuix-sdk-sha256:
    description: ArkUI-X SDK zip 的 SHA256
    required: false
    default: 'eddddab0e8a8da99079035d2fe2e07c01351d795477671e7d99ec8a67e674857'
  android-sdk:
    description: Android SDK 根目录（非空时额外注册给 ace，供 APK 构建使用）
    required: false
    default: ''
  android-ndk:
    description: Android NDK 根目录（非空时导出 ANDROID_NDK_HOME，供原生交叉编译）
    required: false
    default: ''

outputs:
  arkuix-sdk:
    description: ArkUI-X SDK 根目录
    value: ${{ steps.env.outputs.arkuix-sdk }}
  ace-dir:
    description: ace 可执行文件所在目录
    value: ${{ steps.env.outputs.ace-dir }}

runs:
  using: composite
  steps:
    # 工具链约 2GB，缓存命中可省去大量下载时间
    - name: Cache Command Line Tools
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: ./command-line-tools
        key: ${{ runner.os }}-harmony-tools-${{ inputs.tools-version }}

    - name: Download Command Line Tools
      if: steps.cache-tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # 同一次 job 内二次调用（先 HAP 后 APK）时目录已存在，重复解压会触发 unzip 的
        # 交互式覆盖询问 → 读不到 stdin → 退出码 1；直接跳过。
        if [ -d command-line-tools/bin ]; then
          echo "命令行工具链已存在，跳过下载"
          exit 0
        fi
        VER="${{ inputs.tools-version }}"
        URL="${{ inputs.tools-url }}"
        if [ -z "$URL" ]; then
          URL="https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-${VER}/commandline-tools-linux-x64-${VER}.zip"
        fi
        echo "下载鸿蒙命令行工具链: $URL"
        echo "（本工程需要 6.1.1.x 的官方命令行工具链；公开镜像只有 6.1.0.816，其 hvigor 拒绝"
        echo "  modelVersion 6.1.1 且要求华为云没有的 ArkUI-X 6.1.0.28，故需自托管该 zip 并传入地址）"
        # 华为 CDN（contentcenter-vali-drcn.dbankcdn.cn）的签名链接需要浏览器 UA/Referer 才放行；
        # 注意这类链接会过期，长期方案是把 zip 自托管到稳定地址
        curl -fL --retry 3 --retry-delay 5 \
          -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          -e "https://developer.huawei.com/consumer/cn/download/" \
          -o tools.zip "$URL"
        unzip -oq tools.zip
        rm -f tools.zip

    - name: Cache ArkUI-X SDK
      id: cache-arkuix
      uses: actions/cache@v4
      with:
        path: ./arkui-x-sdk
        key: ${{ runner.os }}-arkuix-${{ inputs.arkuix-sdk-version }}

    # SDK 落地与环境配置放在同一个步骤（同一 shell 进程）内：实测出现过
    # 「下载步骤成功、下一独立步骤却看不到该目录」的现象，合并到同一进程即可规避。
    - name: Setup ArkUI-X SDK & Environment
      id: env
      shell: bash
      run: |
        set -euo pipefail
        TOOLS_DIR="$(pwd)/command-line-tools"
        ARKUIX_DIR="$(pwd)/arkui-x-sdk"
        ACE_BIN="$ARKUIX_DIR/24/arkui-x/toolchains/bin"

        if [ "${{ steps.cache-arkuix.outputs.cache-hit }}" != "true" ] \
           && [ ! -d "$ARKUIX_DIR/24/arkui-x/toolchains/bin" ]; then
          VER="${{ inputs.arkuix-sdk-version }}"
          URL="${{ inputs.arkuix-sdk-url }}"
          if [ -z "$URL" ]; then
            URL="https://repo.huaweicloud.com/arkui-crossplatform/sdk/${VER}/linux/arkui-x-linux-x64-${VER}-Release.zip"
          fi
          echo "下载 ArkUI-X SDK: $URL"
          curl -fL --retry 3 --retry-delay 5 -o arkuix.zip "$URL"
          echo "${{ inputs.arkuix-sdk-sha256 }}  arkuix.zip" | sha256sum -c -

          # 目录名必须是纯数字（ace 只认数字版本目录），且 = arkui-x.json 的 apiVersion（本例 24）；
          # 另需 <root>/licenses/（ace 校验许可证目录）
          rm -rf arkuix_tmp
          mkdir -p arkuix_tmp
          unzip -q arkuix.zip -d arkuix_tmp
          mkdir -p "$ARKUIX_DIR/24" "$ARKUIX_DIR/licenses"
          rm -rf "$ARKUIX_DIR/24/arkui-x"
          mv arkuix_tmp/arkui-x "$ARKUIX_DIR/24/arkui-x"
          rm -rf arkuix_tmp arkuix.zip
        fi

        echo "ArkUI-X SDK 落地检查：$ARKUIX_DIR"
        ls "$ARKUIX_DIR/24/arkui-x/toolchains/bin" | head -3

        # 1) hvigor 通过 ohos/local.properties 定位两套 SDK（该文件含机器相关路径，不入库）
        {
          echo "hwsdk.dir=$TOOLS_DIR/sdk"
          echo "arkui-x.dir=$ARKUIX_DIR"
        } > ohos/local.properties

        # 2) ace 硬编码读 APPScope/app.json5，而工程目录是 AppScope（Linux 大小写敏感）
        [ -e ohos/APPScope ] || ln -s AppScope ohos/APPScope

        # 3) 鸿蒙 SDK 的数字版本目录 + licenses（ace 校验「数字版本目录/toolchains」与「licenses 目录」）
        mkdir -p "$TOOLS_DIR/sdk/24" "$TOOLS_DIR/sdk/licenses"
        ln -sfn ../default/openharmony/toolchains "$TOOLS_DIR/sdk/24/toolchains"
        ln -sfn ../default/sdk-pkg.json "$TOOLS_DIR/sdk/24/sdk-pkg.json"

        # 4) DevEco 桩目录：ace 用它判定「工程是否需要升级」，检测到版本 >=6 才会跳过；
        #    否则会提示升级并把 hvigor-config 的 modelVersion 清空，导致 hvigor 拒绝构建。
        DEVECO_STUB="$HOME/deveco-studio"
        mkdir -p "$DEVECO_STUB/bin"
        printf '{\n  "version": "6.1.1",\n  "product": "devecostudio"\n}\n' > "$DEVECO_STUB/product-info.json"
        printf '#!/bin/sh\necho devecostudio stub\n' > "$DEVECO_STUB/bin/devecostudio.sh"
        chmod +x "$DEVECO_STUB/bin/devecostudio.sh"

        echo "$ACE_BIN" >> "$GITHUB_PATH"
        echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
        echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
        echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
        echo "DEVECO_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"

        # 工具链自带 JDK（如有）
        if [ -d "$TOOLS_DIR/jbr" ]; then
          echo "JAVA_HOME=$TOOLS_DIR/jbr" >> "$GITHUB_ENV"
        fi

        chmod -R +x "$TOOLS_DIR/bin"
        if [ ! -d "$ACE_BIN" ]; then
          echo "::error::ace 目录不存在：$ACE_BIN"
          ls -la "$ARKUIX_DIR" 2>&1 || true
          exit 1
        fi
        chmod -R +x "$ACE_BIN"

        # 5) 注册 ACE Tools 的各路径（ace 自身有配置文件，必须显式指向本次下载的目录）
        "$ACE_BIN/ace" config --arkui-x-sdk "$ARKUIX_DIR"
        "$ACE_BIN/ace" config --command-line-tools-path "$TOOLS_DIR"
        "$ACE_BIN/ace" config --ohpm-dir "$TOOLS_DIR/ohpm"
        "$ACE_BIN/ace" config --openharmony-sdk "$TOOLS_DIR/sdk"
        "$ACE_BIN/ace" config --harmonyos-sdk "$TOOLS_DIR/sdk"
        "$ACE_BIN/ace" config --deveco-studio-path "$DEVECO_STUB"
        if [ -n "${{ inputs.android-sdk }}" ]; then
          "$ACE_BIN/ace" config --android-sdk "${{ inputs.android-sdk }}"
        fi
        if [ -n "${{ inputs.android-ndk }}" ]; then
          echo "ANDROID_NDK_HOME=${{ inputs.android-ndk }}" >> "$GITHUB_ENV"
        fi
        "$ACE_BIN/ace" check

        echo "arkuix-sdk=$ARKUIX_DIR" >> "$GITHUB_OUTPUT"
        echo "ace-dir=$ACE_BIN" >> "$GITHUB_OUTPUT"
