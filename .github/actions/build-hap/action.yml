name: Build HarmonyOS HAP
description: 用 ACE Tools（ace build hap）构建无签名 HAP 并输出路径

# 工程已切换为 ArkUI-X 工程结构（hvigorfile 用 AppTasksForArkUIX / HapTasks），
# 因此 HAP 也要走 `ace build hap`，裸 hvigorw 会因缺跨端配置失败。
# 工具链准备见 `.github/actions/setup-arkuix`（含各步骤的原因注释）。

inputs:
  build-mode:
    description: 构建模式（debug 或 release）
    required: false
    default: debug
  tools-version:
    description: 鸿蒙命令行工具链版本（须与工程 hvigor-config 的 modelVersion 配套）
    required: false
    default: '6.1.1.300'
  tools-url:
    description: 命令行工具链 zip 完整地址（自托管包请传入；见迁移指南 CI 章节）
    required: false
    default: ''
  arkuix-sdk-version:
    description: ArkUI-X SDK 版本
    required: false
    default: '6.1.1.111'
  arkuix-sdk-sha256:
    description: ArkUI-X SDK zip 的 SHA256
    required: false
    default: 'eddddab0e8a8da99079035d2fe2e07c01351d795477671e7d99ec8a67e674857'

outputs:
  hap-path:
    description: 构建产出的 HAP 文件绝对路径
    value: ${{ steps.build.outputs.hap-path }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup ArkUI-X Toolchain
      uses: ./.github/actions/setup-arkuix
      with:
        tools-version: ${{ inputs.tools-version }}
        tools-url: ${{ inputs.tools-url }}
        arkuix-sdk-version: ${{ inputs.arkuix-sdk-version }}
        arkuix-sdk-sha256: ${{ inputs.arkuix-sdk-sha256 }}

    # 仓库不保存任何签名材料，CI 固定使用无签名配置
    - name: Apply CI Build Profile
      shell: bash
      run: |
        set -euo pipefail
        cp ohos/build-profile.ci.json5 ohos/build-profile.json5
        echo "已生成无签名 build-profile.json5"

    # 干净检出里没有 `.arkui-x/android|ios`（生成物未入库），但 ace 构建需要它：
    # 先 `ace modify --project` 生成。注意两点（均实测）：
    #   1. 检出里已有提交版 arkui-x-config.json5，modify 见此会拒绝生成（「已是跨端工程」），
    #      故先把它移走、生成后再放回；
    #   2. 平台选 1 = Default(Android, iOS)（与本机一致）。
    - name: Init ArkUI-X Project Structure
      shell: bash
      working-directory: ohos
      run: |
        set -euo pipefail
        cp .arkui-x/arkui-x-config.json5 /tmp/arkui-x-config.json5
        rm -rf .arkui-x
        printf '1\n' | ace modify --project
        cp /tmp/arkui-x-config.json5 .arkui-x/arkui-x-config.json5
        echo "已生成 .arkui-x 工程结构并恢复跨端配置"

    - name: Install Dependencies
      shell: bash
      working-directory: ohos
      run: ohpm install

    - name: Build HAP
      id: build
      shell: bash
      working-directory: ohos
      run: |
        set -euo pipefail
        if [ "${{ inputs.build-mode }}" = "release" ]; then
          ace build hap --release
        else
          ace build hap --debug
        fi

        HAP=$(find . -path '*/outputs/*' -name '*.hap' -type f | head -n 1)
        if [ -z "$HAP" ]; then
          echo "::error::未找到构建产物 HAP"
          find . -name '*.hap' -type f || true
          exit 1
        fi
        echo "构建产物: $HAP"
        echo "hap-path=$(realpath "$HAP")" >> "$GITHUB_OUTPUT"
